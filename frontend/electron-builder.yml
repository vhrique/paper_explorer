appId: com.vhrique.paperreader
productName: Paper Reader
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build   # drop a 512x512+ build/icon.png here for a custom icon

files:
  - dist/**
  - electron/**
  - package.json

# no auto-publish; CI uploads artifacts / attaches to releases explicitly
publish: null

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Education
  artifactName: ${productName}-${version}-${arch}.${ext}
