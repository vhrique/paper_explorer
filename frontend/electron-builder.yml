appId: com.vhrique.paperreader
productName: Paper Reader
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build   # build/icon.png -> auto .ico / .icns / linux png

# The renderer is fully bundled into dist/ by Vite and electron/main.cjs only
# uses built-in modules, so nothing from node_modules needs to ship — and there
# are no native deps to rebuild (canvas is an unused optional dep of pdfjs).
npmRebuild: false
files:
  - dist/**
  - electron/**
  - package.json
  - '!node_modules/**'

# no auto-publish; CI uploads artifacts / attaches to releases explicitly
publish: null

# Register as a PDF handler → shows up under the OS "Open with…" menu.
# (Windows 10/11 still requires a manual click in Settings to make it the default.)
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    role: Editor
    mimeType: application/pdf

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Paper Reader
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Education
  artifactName: ${productName}-${version}-${arch}.${ext}
