services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paper-explorer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/storage
      # Embedding — point to LM Studio or any OpenAI-compatible provider
      - EMBEDDING_BASE_URL=http://host.docker.internal:1234/v1
      - EMBEDDING_API_KEY=lm-studio
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      # LLM — same pattern
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_MODEL=qwen/qwen3-vl-4b
    networks:
      - paper-explorer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paper-explorer-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - paper-explorer-network

networks:
  paper-explorer-network:
    driver: bridge
