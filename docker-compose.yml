services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paper-explorer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@postgres:5432/paper_explorer
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/storage
      # Embedding — point to LM Studio or any OpenAI-compatible provider
      - EMBEDDING_BASE_URL=http://host.docker.internal:1234/v1
      - EMBEDDING_API_KEY=lm-studio
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      # LLM — same pattern
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_MODEL=qwen/qwen3-vl-4b
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paper-explorer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paper-explorer-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - paper-explorer-network

  postgres:
    image: postgres:16
    container_name: paper-explorer-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=paper_explorer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d paper_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paper-explorer-network

volumes:
  postgres_data:

networks:
  paper-explorer-network:
    driver: bridge
