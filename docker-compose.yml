services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paper-explorer-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reloading
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@postgres:5432/paper_explorer
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=paper-explorer
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    networks:
      - paper-explorer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paper-explorer-frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reloading
      - ./frontend:/app
      # Use anonymous volume for node_modules to avoid conflicts
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - paper-explorer-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: paper-explorer-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=paper_explorer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d paper_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paper-explorer-network

  minio:
    image: minio/minio
    container_name: paper-explorer-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - paper-explorer-network

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/paper-explorer || true;
      exit 0;
      "
    networks:
      - paper-explorer-network

volumes:
  postgres_data:
  minio_data:

networks:
  paper-explorer-network:
    driver: bridge
